{% if widget.is_initial and widget.value %}
<div class="rounded-4 border p-3 mb-3">
    <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center">
        <img src="{{ widget.value.url }}" alt="Foto actual del medico" class="doctor-photo">
        <div>
            <p class="mb-2"><strong>Foto actual</strong></p>
            {% if not widget.required %}
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
                    <label class="form-check-label" for="{{ widget.checkbox_id }}">Borrar foto actual</label>
                </div>
            {% endif %}
            <div class="small text-secondary">Puedes reemplazarla seleccionando otra imagen abajo.</div>
        </div>
    </div>
</div>
{% endif %}
<input type="file" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
