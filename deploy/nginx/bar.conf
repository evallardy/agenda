upstream __UPSTREAM_NAME__ {
    server unix:__GUNICORN_SOCKET__ fail_timeout=0;
}

server {
    listen 80;
    server_name __SERVER_NAMES__;

    access_log __LOGS_DIR__/nginx-access.log;
    error_log __LOGS_DIR__/nginx-error.log;

    location /static/ {
        alias __APP_DIR__/staticfiles/;
    }

    location /media/ {
        alias __APP_DIR__/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://__UPSTREAM_NAME__;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}