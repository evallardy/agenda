[program:__SERVICE_NAME__]
directory=__APP_DIR__
command=/bin/bash -lc '__APP_DIR__/deploy/gunicorn_start.sh'
user=__SERVICE_USER__
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__LOGS_DIR__/out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=__LOGS_DIR__/err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"